name: Frozen CUA canonical macOS desktop matrix

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: cua-macos-canonical-544dbac2f30cc02cbd755a03774c4420fd5c9259
  cancel-in-progress: false

# Reuse the complete canonical hosted gate, with no test filters or harness
# overlays. Only this validation wrapper differs from the frozen candidate.
jobs:
  source:
    name: Frozen native source and harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen candidate and clean checkout
        shell: bash
        env:
          CUA_E2E_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${CUA_E2E_SOURCE_SHA}" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]]
          git diff --exit-code 544dbac2f30cc02cbd755a03774c4420fd5c9259 HEAD -- . \
            ':!.github/workflows/opengeni-windows-validation.yml'
  macos:
    needs: source
    uses: jorgensandhaug/cua/.github/workflows/e2e-rust-macos.yml@544dbac2f30cc02cbd755a03774c4420fd5c9259
    with:
      source_sha: ${{ github.sha }}
