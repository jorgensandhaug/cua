name: OpenGeni CUA Windows WPF acceptance

on:
  push:
    branches: [validation/cua-windows-544dbac-20260930]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opengeni-cua-windows-544dbac
  cancel-in-progress: false

jobs:
  candidate:
    name: Frozen public CUA screenshot and input on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CUA_DRIVER_SOURCE_SHA: "544dbac2f30cc02cbd755a03774c4420fd5c9259"
    defaults:
      run:
        shell: pwsh
        working-directory: libs/cua-driver/rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 544dbac2f30cc02cbd755a03774c4420fd5c9259
          persist-credentials: false
      - name: Verify immutable source and runner session
        id: session
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "544dbac2f30cc02cbd755a03774c4420fd5c9259") { throw "Unexpected source revision" }
          $sessionId = (Get-Process -Id $PID).SessionId
          "session_id=$sessionId" >> $env:GITHUB_OUTPUT
          "Source: $actual; Windows session: $sessionId"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Require interactive desktop and prepare trajectory capture
        run: |
          if ((Get-Process -Id $PID).SessionId -eq 0) { throw "WPF acceptance requires an interactive desktop" }
          & "$env:GITHUB_WORKSPACE\scripts\ci\windows\verify-user-session.ps1"
          & "$env:GITHUB_WORKSPACE\scripts\ci\windows\setup-ffmpeg.ps1"
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw "Missing .NET fixture toolchain" }
      - name: Build frozen driver and required WPF fixture
        run: |
          $env:CUA_DRIVER_SOURCE_SHA = "544dbac2f30cc02cbd755a03774c4420fd5c9259"
          cargo build -p cua-driver --bin cua-driver --locked
          if ($LASTEXITCODE -ne 0) { throw "Source-built driver failed" }
          cargo test -p cua-driver-e2e --test harness_wpf_test --no-run --locked
          if ($LASTEXITCODE -ne 0) { throw "WPF suite failed to compile" }
          & "$env:GITHUB_WORKSPACE\libs\cua-driver\tests\fixtures\build\windows.ps1" -Targets wpf
          if ($LASTEXITCODE -ne 0) { throw "WPF fixture failed to build" }
          if (-not (Test-Path "test-apps\harness-wpf\CuaTestHarness.Wpf.exe")) { throw "Required WPF fixture absent" }
      - name: Run real WPF observation screenshot and keyboard cases
        run: |
          $env:CUA_TEST_DRIVER_BIN = Join-Path (Get-Location) "target\debug\cua-driver.exe"
          $env:CUA_TEST_WORKSPACE_ROOT = (Get-Location).Path
          $env:CUA_TEST_APPS_ROOT = Join-Path (Get-Location) "test-apps"
          $env:CUA_TEST_REQUIRE_DRIVER_BIN = "1"
          $env:CUA_TEST_REQUIRE_FIXTURES = "1"
          $env:CUA_TEST_DRIVER_STDERR = "1"
          $env:CUA_E2E_FORBID_SKIPS = "1"
          $env:CUA_E2E_UNRESTRICTED_GUI = "1"
          $env:CUA_E2E_SOURCE_SHA = "544dbac2f30cc02cbd755a03774c4420fd5c9259"
          $artifacts = Join-Path $env:RUNNER_TEMP "cua-wpf-acceptance"
          New-Item -ItemType Directory -Force $artifacts | Out-Null
          $env:CUA_E2E_RESULTS_FILE = Join-Path $artifacts "results.jsonl"
          $env:CUA_E2E_RECORDINGS_ROOT = Join-Path $artifacts "recordings"
          $tests = @(
            "harness_wpf_smoke",
            "harness_wpf_query_projects_structured_elements",
            "harness_wpf_stale_element_token_fails_closed",
            "harness_wpf_layered_popup_capture",
            "harness_wpf_type_text"
          )
          $failures = @()
          foreach ($test in $tests) {
            $savedPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              $output = @(& cargo test -p cua-driver-e2e --test harness_wpf_test $test --locked -- --ignored --exact --nocapture --test-threads=1 2>&1)
              $exitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedPreference
            }
            $output | Tee-Object -FilePath (Join-Path $artifacts "$test.log")
            if ($exitCode -ne 0 -or -not ($output -match 'test result: ok\. 1 passed')) { $failures += $test }
          }
          if ($failures.Count -ne 0) { throw "WPF cases failed: $($failures -join ', ')" }
      - name: Retain public fixture evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: frozen-cua-wpf-544dbac
          path: ${{ runner.temp }}/cua-wpf-acceptance
          if-no-files-found: warn
          retention-days: 7
